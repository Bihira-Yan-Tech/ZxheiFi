<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZxheiFi - Vouchers</title>
<style>
  /* Thermal receipt layout, tuned for 58mm printers (~220px print width). */
  @page { size: 58mm auto; margin: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Courier New', Courier, monospace;
    background: #ccc;
  }
  .sheet {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px;
  }
  .ticket {
    width: 58mm;
    padding: 10px 8px;
    background: #fff;
    border: 1px dashed #000;
    text-align: center;
    page-break-after: always;
  }
  .ticket .brand {
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 2px;
    color: {{ACCENT_COLOR}};
  }
  .ticket .tier {
    font-size: 11px;
    margin-bottom: 6px;
  }
  .ticket .code {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
    padding: 6px 0;
    color: {{ACCENT_COLOR}};
    border-top: 1px dashed #000;
    border-bottom: 1px dashed #000;
    margin: 6px 0;
  }
  .ticket .qr {
    margin: 6px auto;
    width: 34mm;
    height: 34mm;
  }
  .ticket .qr img { width: 100%; height: 100%; image-rendering: pixelated; }
  .ticket .meta {
    font-size: 10px;
    line-height: 1.5;
    text-align: left;
    margin-top: 4px;
  }
  .ticket .meta span { float: right; }
  .ticket .meta::after { content: ""; display: block; clear: both; }
  .ticket .footer {
    font-size: 9px;
    color: #444;
    margin-top: 6px;
  }
  @media print {
    body { background: #fff; }
    .sheet { gap: 0; padding: 0; }
    .ticket { border: 1px dashed #000; }
  }
</style>
</head>
<body>
<div class="sheet">
{{TICKETS}}
</div>
</body>
</html>
