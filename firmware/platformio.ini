; Main unit firmware. Build:  pio run -d firmware
; Output: firmware/.pio/build/main_esp8266/firmware.bin -> copy to
; firmware/zxheifi_firmware.bin (the file the Setup Companion flashes).
[platformio]
src_dir = .

[env:main_esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^6.21.0
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -I ../common
