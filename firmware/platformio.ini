; Main unit firmware - one source tree, two boards.
;   pio run -d firmware -e main_esp8266   -> .pio/build/main_esp8266/firmware.bin
;                                             copy to firmware/zxheifi_firmware.bin
;   pio run -d firmware -e main_esp32     -> then: python tools/merge_esp32.py
;                                             writes firmware/zxheifi_firmware_esp32.bin
; Keep -I paths relative: PlatformIO splits ${PROJECT_DIR} on the spaces in this path.
[platformio]
src_dir = .
default_envs = main_esp8266

[env]
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^6.21.0
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -I ../common

[env:main_esp8266]
platform = espressif8266
board = nodemcuv2

[env:main_esp32]
platform = espressif32
board = esp32dev
board_build.partitions = default.csv
