; Charging Station firmware. Build:  pio run -d charging
; Output: charging/.pio/build/charging_esp8266/firmware.bin -> copy to
; charging/zxheifi_charging.bin (the file the Setup Companion flashes).
[platformio]
src_dir = .

[env:charging_esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^6.21.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0
build_flags =
    -I ../common
