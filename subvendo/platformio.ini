; Sub Vendo firmware. Build:  pio run -d subvendo
; Output: subvendo/.pio/build/sub_esp8266/firmware.bin -> copy to
; subvendo/zxheifi_subvendo.bin (the file the Setup Companion flashes).
[platformio]
src_dir = .

[env:sub_esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^6.21.0
build_flags =
    -I ../common
